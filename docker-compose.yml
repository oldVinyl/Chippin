services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chippin
      POSTGRES_PASSWORD: local_only_change_me
      POSTGRES_DB: chippin
    ports:
      - '5434:5432'
    volumes:
      - chippin-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chippin']
      interval: 2s
      retries: 20
volumes:
  chippin-db:
